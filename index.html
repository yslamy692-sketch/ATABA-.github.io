<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A&R Video Loader v2</title>
    <style>
        body { background: #050505; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #111; border: 1px solid #d4af37; padding: 30px; border-radius: 15px; max-width: 500px; margin: auto; }
        input { width: 80%; padding: 12px; margin: 20px 0; background: #000; border: 1px solid #333; color: white; border-radius: 8px; }
        button { background: #d4af37; color: black; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .result { margin-top: 20px; display: none; background: #1a1a1a; padding: 15px; border-radius: 10px; }
        img { width: 100%; border-radius: 8px; }
        .dl-btn { display: block; margin-top: 10px; padding: 10px; background: #28a745; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h1 style="color:#d4af37">A&R LOADER</h1>
    <input type="text" id="urlInput" placeholder="YouTube URL bärde goýuň...">
    <button onclick="fetchVideo()">WIDEOYNY TAP</button>

    <div id="loader" style="display:none; color:#d4af37; margin-top:10px;">Gözlenýär...</div>

    <div id="resultBox" class="result">
        <img id="thumb" src="">
        <h3 id="title" style="color:#d4af37"></h3>
        <p id="channel" style="font-size:0.8rem; color:#aaa;"></p>
        <div id="links"></div>
    </div>
</div>

<script>
    async function fetchVideo() {
        const url = document.getElementById('urlInput').value;
        const resBox = document.getElementById('resultBox');
        const loader = document.getElementById('loader');
        
        // YouTube ID-sini almak
        const idMatch = url.match(/(?:v=|shorts\/|youtu.be\/)([a-zA-Z0-9_-]{11})/);
        if(!idMatch) return alert("Link nädogry!");

        loader.style.display = "block";
        resBox.style.display = "none";

        const options = {
            method: 'GET',
            headers: {
                'x-rapidapi-key': '498be86516msh65103abe6c31824p18cf73jsn01f344a95fda',
                'x-rapidapi-host': 'youtube-search-and-download.p.rapidapi.com'
            }
        };

        try {
            // Skrinşotyňdaky maglumatlara görä, biz 'video' endpoint-yny ulanmaly
            const response = await fetch(`https://youtube-search-and-download.p.rapidapi.com/video?id=${idMatch[1]}`, options);
            const data = await response.json();

            // JSON içindäki maglumatlary ýerleşdirmek
            document.getElementById('title').innerText = data.videoDetails.title;
            document.getElementById('channel').innerText = "Kanal: " + data.videoDetails.author;
            document.getElementById('thumb').src = data.videoDetails.thumbnail.thumbnails.pop().url;

            let linksHtml = "";
            // MP4 Formatlaryny tapmak
            const formats = data.streamingData.formats;
            if(formats && formats.length > 0) {
                linksHtml += `<a href="${formats[0].url}" class="dl-btn" target="_blank">MP4 ÝÜKLE (HD)</a>`;
            }

            // MP3 (Audio) üçin adaptiveFormats ulanarys
            const audio = data.streamingData.adaptiveFormats.find(f => f.mimeType.includes('audio/'));
            if(audio) {
                linksHtml += `<a href="${audio.url}" class="dl-btn" style="background:#007bff" target="_blank">MP3 ÝÜKLE</a>`;
            }

            document.getElementById('links').innerHTML = linksHtml;
            loader.style.display = "none";
            resBox.style.display = "block";

        } catch (e) {
            loader.style.display = "none";
            alert("API jogap bermedi. Limit dolan bolup biler.");
            console.error(e);
        }
    }
</script>

</body>
</html>
