<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProDownloader | HTML Only</title>
    <style>
        /* CSS STILLERI (BET DIZAYN) */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: white;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            width: 90%;
            max-width: 450px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #f43f5e, #fb923c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 12px;
            border: 2px solid #334155;
            background: #1e293b;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #f43f5e;
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.2);
        }

        button {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, #f43f5e, #fb923c);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(244, 63, 94, 0.4);
        }

        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Video<span>IN</span></h1>
        <p>Link goýuň we çalt indiriň</p>

        <!-- JAVASCRIPT-SIZ IŞLEÝÄN BÖLÜM -->
        <!-- SaveFrom.net-iň öz ugratma algoritmini ulanýarys -->
        <form action="https://ssyoutube.com/watch" method="get" target="_blank">
            <div class="input-group">
                <!-- Name="v" bolanda, SaveFrom ony YouTube ID-sy hökmünde okaýar -->
                <input type="text" name="v" placeholder="YouTube linkini bärden goýuň..." required>
                <button type="submit">Wideo Göçür</button>
            </div>
        </form>

        <div class="footer-note">
            * Bu saýt diňe HTML we CSS arkaly taýýarlandy.
        </div>
    </div>

</body>
</html>
